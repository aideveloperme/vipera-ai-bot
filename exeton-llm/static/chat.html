<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exeton Sales Engineer</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --text:#1b1f24; --muted:#6b7280; --accent:#0b6bcb; --me:#0b6bcb; --me-text:#fff; --bot:#eef1f5; --border:#e3e6ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#171a21; --text:#e6e8eb; --muted:#9aa3ad; --accent:#4ea1ff; --me:#2b6cb0; --me-text:#fff; --bot:#222733; --border:#2a2f3a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .app { max-width:820px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; padding:0 16px; }
  header { padding:16px 0 8px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); color:var(--me-text); border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .bot a { color:var(--accent); }
  .sources { margin-top:8px; font-size:12px; color:var(--muted); }
  .sources a { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .typing { color:var(--muted); font-style:italic; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding-bottom:8px; }
  .chips button { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  form { display:flex; gap:8px; padding:12px 0 16px; border-top:1px solid var(--border); }
  textarea { flex:1; resize:none; height:46px; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--text); font:inherit; }
  button.send { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Exeton Sales Engineer</h1>
    <p>Ask about AI servers, GPUs and workstations — specs, price and availability from exeton.com.</p>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips">
    <button>Do you have HGX B300 servers in stock?</button>
    <button>What workstation do you recommend for fine-tuning a 70B model?</button>
    <button>How can I contact sales?</button>
  </div>
  <form id="form">
    <textarea id="input" placeholder="Type your question…" autofocus></textarea>
    <button class="send" id="send">Send</button>
  </form>
</div>
<script>
  const API = "chat";             // same server that serves this page
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = [];

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function linkify(s) {
    return escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/(https?:\/\/[^\s)<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function add(role, html) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function ask(text) {
    text = text.trim();
    if (!text) return;
    document.getElementById("chips").style.display = "none";
    add("me", escapeHtml(text));
    input.value = "";
    send.disabled = true;
    const pending = add("bot", '<span class="typing">Checking the catalog…</span>');
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text, history: history.slice(-6)}),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const products = (data.sources || []).filter((s, i, a) => s.url && a.findIndex(x => x.url === s.url) === i);
      pending.innerHTML = linkify(data.reply) + (products.length
        ? '<div class="sources">Sources:' + products.slice(0, 4).map(s =>
            `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.name || s.url)}</a>`).join("") + "</div>"
        : "");
      history.push({role: "user", content: text}, {role: "assistant", content: data.reply});
    } catch (e) {
      pending.innerHTML = "Sorry, something went wrong (" + escapeHtml(e.message) + "). Please try again.";
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
  document.querySelectorAll("#chips button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
</script>
</body>
</html>
